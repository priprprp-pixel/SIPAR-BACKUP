[providers]
providers = ['php', 'node']

[phases.setup]
nixPkgs = ['php82', 'php82Extensions.pdo_mysql', 'php82Extensions.gd', 'composer', 'nodejs_20']

[phases.build]
cmds = ['mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache', 'chmod -R 775 storage bootstrap/cache']

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=$PORT'